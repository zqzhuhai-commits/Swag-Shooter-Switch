name: Publish 0.14.58
on:
  push:
    branches: [main]
    paths: [.github/releases/v0.14.58.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-release-0.14.58
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zqzhuhai-commits/Swag-Shooter-Switch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested package and publish attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release_01458.py .github/releases/v0.14.58.json
